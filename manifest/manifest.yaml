apiVersion: apps/v1
kind: Deployment
metadata:
  name: tapestry-demo
  labels:
    app.kubernetes.io/name: tapestry-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tapestry-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tapestry-demo
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: nginx-tmp
          emptyDir: {}
      containers:
        - name: frontend
          image: docker.io/ghulam6703/tapestry:21
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
---
apiVersion: v1
kind: Service
metadata:
  name: tapestry-demo
spec:
  selector:
    app.kubernetes.io/name: tapestry-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tapestry-demo
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tapestry-demo
                port:
                  name: http
